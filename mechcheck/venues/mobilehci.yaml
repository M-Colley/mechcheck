# ACM MobileHCI -- venue pack
#
# Read off the MobileHCI 2026 papers page on the `verified` date. Limits and
# required statements change every cycle: re-read the current call before you
# trust this file, and update `verified` when you do.
name: ACM MobileHCI
verified: 2026-09-21
source_url: https://mobilehci.acm.org/2026/submit/papers.html

document_class: acmart
bibliography_style: ACM-Reference-Format

class_options:
  submission:
    required:
      - manuscript
      - review
    forbidden:
      - sigconf
  final:
    forbidden:
      - review
      - anonymous

anonymity:
  model: double-anonymous
  note: 'Reviewing is double-anonymous: reviewers and authors are anonymous to each other. Use manuscript,review,anonymous for the submission.'

length:
  unit: words
  min_words: 4000
  max_words: 12000
  excludes: 'references and appendix do not count'
  note: 'Typical length is 4000 to 9000 words. Any length is allowed if the contribution is commensurate, but above 12000 words the conference may reject the paper if no justification is given.'

accessibility:
  descriptions_required: true

requires:
  ai_disclosure: true
  data_availability: false

required_commands:
  - command: ccsdesc
    why: 'ACM requires CCS concepts; TAPS rejects submissions without them'
  - command: keywords

filename_charset_strict: true

community:
  name: SIGCHI/HCI
  min_references: 4
  venues:
    - CHI
    - UIST
    - CSCW
    - DIS
    - ASSETS
    - MobileHCI
    - IUI
    - TEI
    - UbiComp
    - IMWUT
    - CHI PLAY
    - IDC
    - VRST
    - EICS
    - CUI
    - AutomotiveUI
    - AutoUI
    - Automotive User Interfaces
    - TOCHI
    - Human Factors in Computing Systems
    - Computer-Supported Cooperative Work
    - Computer Supported Cooperative Work
    - User Interface Software
    - Interacting with Computers
    - Human-Computer Interaction
    - Human Computer Interaction
    - Human-Computer Studies

rules:
  MET001:
    max_words: 12000
    min_words: 4000

uncertain:
  - 'The 12000-word figure is a rejection threshold conditional on justification, not a hard cap, and mechchecks word count approximates the venues basis rather than reproducing it.'
  - 'The screen option appears in the venues own documentclass line; it is a rendering choice rather than a requirement, so it is not enforced here.'
  - 'The community reference threshold (min_references) is not measured for this venue. CHI publishes the numbers behind its own -- accepted papers cite a median of 17 SIGCHI references, papers desk-rejected as out of scope a median of 0 -- and this pack reuses that shape by analogy. Treat VEN010 as a prompt to look, never as a measurement.'
