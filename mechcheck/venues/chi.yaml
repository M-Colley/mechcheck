# ACM CHI -- venue pack
#
# Every value below was read off the CHI 2026 author pages on the `verified`
# date. Page limits and required statements change every cycle: re-read the
# current call before you trust this file, and update `verified` when you do.
name: ACM CHI
verified: 2026-08-27
source_url: https://chi2026.acm.org/chi-publication-formats/

document_class: acmart
bibliography_style: ACM-Reference-Format

class_options:
  submission:
    required:
      - manuscript
      - review
    forbidden:
      - sigconf
  final:
    required:
      - sigconf
    forbidden:
      - review
      - anonymous

anonymity:
  model: double-anonymous
  note: 'CHI review is anonymous; acmart replaces the author block when the anonymous option is set.'

length:
  unit: words
  max_words: 12000
  excludes: 'references, figures and tables are not counted as main text'
  note: 'CHI has no page limit: length must be commensurate with the contribution. The chairs state that submissions above 12000 words are desk-rejected if the excessive length is not justified, so this is a threshold to be able to defend rather than a hard cap.'

accessibility:
  descriptions_required: true
  note: 'ACM requires alt text for every figure and validates it in TAPS.'

requires:
  ai_disclosure: true
  data_availability: false

required_commands:
  - command: ccsdesc
    why: 'ACM requires CCS concepts; TAPS rejects submissions without them'
  - command: keywords
    why: 'ACM templates expect keywords'

filename_charset_strict: true
forbidden_packages_fix: 'TAPS compiles your sources itself and only supports its accepted package list: https://www.acm.org/publications/taps/accepted-latex-packages'

community:
  name: SIGCHI/HCI
  min_references: 4
  venues:
    - CHI
    - UIST
    - CSCW
    - DIS
    - ASSETS
    - MobileHCI
    - IUI
    - TEI
    - UbiComp
    - IMWUT
    - CHI PLAY
    - IDC
    - VRST
    - EICS
    - CUI
    - AutomotiveUI
    - AutoUI
    - Automotive User Interfaces
    - TOCHI
    - Human Factors in Computing Systems
    - Computer-Supported Cooperative Work
    - Computer Supported Cooperative Work
    - User Interface Software
    - Interacting with Computers
    - Human-Computer Interaction
    - Human Computer Interaction
    - Human-Computer Studies

rules:
  MET004:
    min_references: 25

uncertain:
  - 'The 12000-word threshold is the one the chairs published; it is conditional on justification, not a hard cap, and mechchecks word count approximates their basis (references, captions and appendices excluded; abstract counted) rather than reproducing it. Check against your own texcount before acting on a near-miss.'
  - 'No page limit is encoded, because CHI states length should be commensurate with contribution rather than giving a number.'
  - 'The community reference threshold comes from the chairs own desk-reject figures (accepted papers cite a median of 17 SIGCHI references; papers rejected as out of scope a median of 0). It is a prompt to look, not a criterion anyone applies numerically.'
