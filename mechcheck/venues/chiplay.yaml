# ACM CHI PLAY (PACM HCI, GAMES track) -- venue pack
#
# Read off the CHI PLAY 2026 full papers page on the `verified` date. CHI PLAY
# full papers are published in PACM HCI rather than in conference proceedings.
name: ACM CHI PLAY (PACM HCI GAMES)
verified: 2026-09-21
source_url: https://chiplay.acm.org/2026/full-papers/

document_class: acmart
bibliography_style: ACM-Reference-Format

class_options:
  submission:
    required:
      - manuscript
      - review
      - anonymous
    forbidden:
      - sigconf
  final:
    forbidden:
      - review
      - anonymous

anonymity:
  model: double-anonymous
  note: 'Use manuscript,review,anonymous. The anonymous option replaces the author block with ANONYMOUS AUTHOR(S); the submission must be anonymised whether or not that option is used.'

length:
  unit: none
  excludes: 'not applicable: no limit is imposed'
  note: 'No minimum or maximum length is imposed. Reviewers assess the contribution relative to the length, so a long paper has to earn it.'

accessibility:
  descriptions_required: true

requires:
  ai_disclosure: true
  data_availability: false

required_commands:
  - command: ccsdesc
    why: 'ACM requires CCS concepts; TAPS rejects submissions without them'
  - command: keywords

filename_charset_strict: true

community:
  name: SIGCHI/HCI
  min_references: 4
  venues:
    - CHI
    - UIST
    - CSCW
    - DIS
    - ASSETS
    - MobileHCI
    - IUI
    - TEI
    - UbiComp
    - IMWUT
    - CHI PLAY
    - IDC
    - VRST
    - EICS
    - CUI
    - AutomotiveUI
    - AutoUI
    - Automotive User Interfaces
    - TOCHI
    - Human Factors in Computing Systems
    - Computer-Supported Cooperative Work
    - Computer Supported Cooperative Work
    - User Interface Software
    - Interacting with Computers
    - Human-Computer Interaction
    - Human Computer Interaction
    - Human-Computer Studies

uncertain:
  - 'No length limit is encoded because the track imposes none. Earlier cycles suggested a typical full paper is under about 8500 words; that is guidance from a previous year and is not enforced here.'
  - 'The community reference threshold (min_references) is not measured for this venue. CHI publishes the numbers behind its own -- accepted papers cite a median of 17 SIGCHI references, papers desk-rejected as out of scope a median of 0 -- and this pack reuses that shape by analogy. Treat VEN010 as a prompt to look, never as a measurement.'
