name: mechcheck self-test

# This is the workflow for the checker's own repository: it tests the Python
# package, and -- crucially -- compiles a real LaTeX document against
# mechcheck.sty. The .sty cannot be meaningfully unit-tested any other way, so
# that job is the thing that proves the in-Overleaf layer works.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Check the rule reference is up to date
        run: |
          mechcheck rules --markdown > /tmp/rules.md
          diff -u docs/rules.md /tmp/rules.md || {
            echo "::error::docs/rules.md is stale — run: mechcheck rules --markdown > docs/rules.md"
            exit 1
          }

      - name: Self-check the example projects (offline)
        run: |
          mechcheck check tests/fixtures/sample --offline --fail-on never
          mechcheck check tests/fixtures/paper --venue autoui --offline --fail-on never

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: The browser engine, against the same fixtures as Python
        run: node browser/test-engine.mjs

      - name: The extension's engine must be in sync with the page
        run: |
          node browser/build-extension.mjs
          git diff --exit-code -- extension/engine.js || {
            echo "::error::extension/engine.js is stale — run: node browser/build-extension.mjs"
            exit 1
          }

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # apt rather than a setup action: this repository cannot pull third-party
      # actions ("Repository access blocked"), and the demo deliberately needs
      # only a base LaTeX with expl3 and latexmk.
      - name: Install a TeX Live subset
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended latexmk
          pdflatex --version | head -1

      # One script, so the assertions cannot drift from the ones run locally.
      - name: Verify mechcheck.sty against a real LaTeX
        run: bash latex/verify-sty.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latex-output
          path: |
            latex/demo/*.pdf
            latex/demo/*.log
            latex/demo/mechcheck-report.txt
          if-no-files-found: ignore
